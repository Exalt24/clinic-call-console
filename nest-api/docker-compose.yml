# Local PostgreSQL for the NestJS API and its tests. Throwaway sample-data database: the credentials below exist only here.
name: clinic-nest
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinic_nest
    ports:
      - "55442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic_nest"]
      interval: 2s
      timeout: 3s
      retries: 30
