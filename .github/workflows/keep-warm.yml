name: Keep the demo API awake

# Free hosting puts an idle service to sleep and waking it takes a minute or more. A request every ten minutes keeps the
# public demo answering. GitHub schedules can run late, so this narrows the sleeping window and does not remove it; the login
# page also says so honestly when the server is still waking.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        env:
          API_URL: ${{ vars.DEMO_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then echo "DEMO_API_URL is not set, nothing to ping"; exit 0; fi
          curl -s -o /dev/null -w "health %{http_code}\n" --max-time 120 "$API_URL/actuator/health" || true
